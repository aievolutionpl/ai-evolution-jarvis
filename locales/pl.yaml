    saved_global:           "Zapisano w config.yaml (`--global`)"
    session_only_hint:      "_(tylko ta sesja — dodaj `--global`, aby zapisać na stałe)_"
    current_label:          "Bieżący: `{model}` u {provider}"
    current_tag:            " (bieżący)"
    more_models_suffix:     " (+{count} więcej)"
    usage_switch_model:     "`/model <nazwa>` — zmiana modelu"
    usage_switch_provider:  "`/model <nazwa> --provider <slug>` — zmiana dostawcy"
    usage_persist:          "`/model <nazwa> --global` — zapis na stałe"

