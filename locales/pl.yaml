# Katalog statycznych komunikatów Hermesa -- polski (pl)
#
# Tylko statyczne komunikaty widoczne dla użytkownika: prompt zatwierdzania w CLI
# oraz wybrane odpowiedzi slash-komend w bramce (gateway).  Wynik generowany przez
# agenta, logi, tracebacki, wyjścia narzędzi i opisy slash-komend pozostają po
# angielsku i NIE są tłumaczone -- patrz agent/i18n.py (uzasadnienie zakresu).
#
# Klucze to ścieżki kropkowe; zagnieżdżenie służy tylko czytelności.  Wartości mogą
# zawierać tokeny {placeholder} dla str.format.  Przy dodawaniu nowego klucza dodaj
# go do KAŻDEGO pliku lokalizacji w tym samym commicie -- tests/agent/test_i18n.py
# wymusza zgodność katalogów.
#
# Litery skrótów w menu zatwierdzania (r/s/z/d) muszą zgadzać się z aliasami
# dopisanymi w tools/approval_prompt.py -- inaczej wpisany skrót traktowany jest
# jak odmowa (fail-closed).

approval:
  # Prompt zatwierdzania w CLI -- pokazywany, gdy polecenie wymaga decyzji użytkownika.
  dangerous_header: "⚠️  NIEBEZPIECZNE POLECENIE: {description}"
  choose_long:     "      [r]az  |  [s]esja  |  [z]awsze  |  [d]otąd"
  choose_short:    "      [r]az  |  [s]esja  |  [d]otąd"
  prompt_long:     "      Wybór [r/s/z/D]: "
  prompt_short:    "      Wybór [r/s/D]: "
  choose_smart_deny: "      [r]az  |  [d]otąd"
  prompt_smart_deny: "      Wybór [r/D]: "
  smart_deny_once_inputs: "r,raz"
  smart_deny_deny_inputs: "d,dotąd"
  timeout:         "      ⏱ Minął czas - polecenie odrzucone"
  allowed_once:    "      ✓ Zezwolono jednorazowo"
  allowed_session: "      ✓ Zezwolono w tej sesji"
  allowed_always:  "      ✓ Dodano do trwałej listy dozwolonych"
  denied:          "      ✗ Odmówiono"
  cancelled:       "      ✗ Anulowano"
  blocklist_message: "To polecenie jest na bezwarunkowej czarnej liście i nie może zostać zatwierdzone."

gateway:
