  draining:         "⏳ Kończę {count} aktywnych zadań agenta przed restartem..."
  goal_cleared:     "✓ Cel wyczyszczony."
  no_active_goal:   "Brak aktywnego celu."
  config_read_failed: "⚠️ Nie udało się odczytać config.yaml: {error}"
  config_save_failed: "⚠️ Nie udało się zapisać konfiguracji: {error}"

  # Wyjście komendy /model -- pokazywane po zmianie modelu lub przy listowaniu modeli.
  # Nazwy dostawców, identyfikatory modeli, ciągi możliwości i kwoty kosztów NIE są
  # tłumaczone -- to identyfikatory/wartości, nie proza.  Tłumaczone są etykiety
  # ("Dostawca:", "Kontekst:" itd.) oraz linie pomocy/stopki.
  model:
    error_prefix:           "Błąd: {error}"
    switched:               "Model zmieniony na `{model}`"
    provider_label:         "Dostawca: {provider}"
    context_label:          "Kontekst: {tokens} tokenów"
    max_output_label:       "Maks. wyjście: {tokens} tokenów"
    cost_label:             "Koszt: {cost}"
    capabilities_label:     "Możliwości: {capabilities}"
